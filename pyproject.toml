[project]
name = "radiotui"
version = "0.1.0"
description = "Autonomous RTL-SDR spectrum scanner with a terminal UI: sweeps, live-frequency detection, listen/record, and an antenna advisor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pablo" }]
dependencies = [
    "numpy>=1.26",
    "textual>=0.60",
]

[project.optional-dependencies]
# Business decision: pyrtlsdr pinned to 0.2.92 because >= 0.3 binds
# rtlsdr_set_dithering at import time, which distro librtlsdr builds
# (e.g. Ubuntu 24.04) do not export. Revisit when we ship our own
# librtlsdr build or drop distro packages.
sdr = ["pyrtlsdr==0.2.92", "setuptools>=75,<81"]

[project.scripts]
radiotui = "radiotui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radiotui"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["radiotui"]
