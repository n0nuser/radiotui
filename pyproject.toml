[project]
name = "radiotui"
version = "0.1.0"
description = "Autonomous RTL-SDR spectrum scanner with a terminal UI: sweeps, live-frequency detection, listen/record, and an antenna advisor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pablo" }]
dependencies = [
    "numpy>=1.26",
    "textual>=0.60",
]

[project.optional-dependencies]
sdr = ["pyrtlsdr>=0.2.92"]

[project.scripts]
radiotui = "radiotui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radiotui"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
